[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rimetra"
version = "1.3.0"
description = "Rimetra — aile tahlil takip sistemi"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "reportlab>=4.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rimetra = "app.cli:main"

[tool.setuptools]
packages = ["app", "app.api", "app.services"]

[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
